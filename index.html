<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>向上訓練</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="向上訓練">
<meta name="theme-color" content="#F3F4F1">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/apple-touch-icon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="manifest" href='data:application/manifest+json,{"name":"向上訓練","short_name":"向上訓練","display":"standalone","background_color":"%23F3F4F1","theme_color":"%23F3F4F1","start_url":"/","icons":[{"src":"/apple-touch-icon.png","sizes":"192x192","type":"image/png","purpose":"any"}]}'>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#15172A;
  --paper:#F3F4F1;
  --surface:#FFFFFF;
  --line:#E4E5E0;
  --muted:#6A6F82;
  --blue:#2C43D8;
  --blue-soft:#E9ECFF;
  --amber:#F5A524;
  --amber-soft:#FCEFD4;
  --good:#159C73;
  --shadow:0 1px 2px rgba(21,23,42,.04),0 8px 24px rgba(21,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans TC",-apple-system,system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:100px;
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  padding-top:env(safe-area-inset-top,0px);
}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}

/* header */
header{
  padding:18px 18px 10px;
  max-width:600px;margin:0 auto;
}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:"Oswald",sans-serif;font-weight:600;font-size:28px;letter-spacing:.05em;line-height:1.1}
.brand .sub{font-family:"Oswald",sans-serif;font-weight:500;font-size:12px;letter-spacing:.2em;color:var(--blue)}
.who{margin-top:4px;font-size:12.5px;color:var(--muted)}

/* hero dark card */
.hero{
  background:var(--ink);color:#EDEEF5;border-radius:22px;
  padding:20px;box-shadow:var(--shadow);margin-bottom:14px;
}
.hero .lead{font-size:14.5px;line-height:1.65;color:#C7CBDE;margin-bottom:16px}
.hero .lead b{color:#fff;font-weight:700}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.chart-title{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.14em;color:#8A90A8}
.legend{display:flex;gap:12px;font-size:11px;color:#8A90A8}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.amber{background:var(--amber)}
.dot.blue{background:transparent;border:1.5px dashed #6D7BEF}
svg.profile{width:100%;height:auto;display:block}
.axis-tick{font-family:"Oswald",sans-serif;font-size:12px;fill:#8A90A8}
.month-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.month-chip{text-align:center;padding:9px 2px 0;border-top:1px solid rgba(255,255,255,.12)}
.month-chip .m{font-size:11px;color:#8A90A8}
.month-chip .w{font-family:"Oswald",sans-serif;font-size:16px;font-weight:600;color:var(--amber);margin-top:1px}

/* gauge hero */
.hero.gauge-hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.gauge{position:relative;width:92px;height:240px;flex:0 0 92px}
.gauge .track{position:absolute;right:2px;top:0;bottom:0;width:10px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden}
.gauge .fill{position:absolute;left:0;bottom:0;width:100%;background:linear-gradient(180deg,#5B6BF0,#2C43D8);height:0;border-radius:6px;transition:height 1.1s cubic-bezier(.2,.8,.2,1) .25s}
.gauge .zone{position:absolute;right:2px;width:10px;border-radius:6px;background:repeating-linear-gradient(180deg,var(--amber) 0 5px,transparent 5px 10px);opacity:.9}
.gauge .tick{position:absolute;right:0;width:92px;height:0}
.gauge .tick i{position:absolute;right:14px;width:14px;height:2px;background:rgba(255,255,255,.35);top:-1px}
.gauge .tick b{position:absolute;right:32px;top:-9px;font-family:"Oswald",sans-serif;font-weight:600;font-size:12px;color:#C7CBDE;white-space:nowrap}
.gtxt .gk{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.14em;color:var(--amber);margin-bottom:6px}
.gtxt .gv{font-size:14px;line-height:1.6;color:#C7CBDE}
.gtxt .gv b{color:#fff}
.gtxt .grow{border-top:1px solid rgba(255,255,255,.12);padding-top:9px;margin-top:9px;font-size:12.5px;color:#8A90A8}

/* stats */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.stat .v{font-family:"Oswald",sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em}
.stat .v small{font-family:"Noto Sans TC",sans-serif;font-weight:400;color:var(--muted);font-size:11.5px}
.stat .v2{font-family:"Oswald",sans-serif;font-size:14px;font-weight:500;color:var(--muted);margin-top:2px}
.stat.p .v{color:var(--amber)}
.stat.s .v{color:var(--blue)}

/* tabs */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;display:flex;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 2px calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:calc(2px + env(safe-area-inset-left,0px));
  padding-right:calc(2px + env(safe-area-inset-right,0px));
  z-index:9999;transform:translate3d(0,0,0);
}
.tabbtn{flex:1;background:none;border:none;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;border-radius:12px}
.tabbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}
.tabbtn.active{color:var(--blue)}

.panel{display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.eyebrow{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.16em;color:var(--blue);margin:24px 0 9px}
.eyebrow:first-child{margin-top:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.card-h .name{font-size:15.5px;font-weight:700}
.card-h .tag{font-family:"Oswald",sans-serif;font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:3px 10px;border-radius:100px;white-space:nowrap}
.card-h .tag.blue{color:var(--blue);background:var(--blue-soft)}
.card p{font-size:13.5px;color:#33364a}
.card .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:9px;padding-top:8px}
.card .row b{color:var(--ink);font-family:"Oswald",sans-serif;font-weight:600;font-size:13px}

.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 15px 5px;margin-bottom:12px;box-shadow:var(--shadow)}
.day-h{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.day-h .code{font-family:"Oswald",sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;color:#fff;background:var(--blue);padding:4px 11px;border-radius:100px}
.tmpl-day .day-h .code{background:var(--amber)}
.day-h .focus{font-size:12.5px;color:var(--muted)}
.ex{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex .name{font-size:14px;font-weight:700}
.ex .note{font-size:12px;color:var(--muted);margin-top:2px}
.ex .dose{font-family:"Oswald",sans-serif;font-size:15px;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.ex .dose small{color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:400}

.note-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--blue)}
.note-card.amber{border-left-color:var(--amber)}
.note-card.warn{border-left-color:#C0392B}
.note-card.good{border-left-color:var(--good)}
.note-card h3{font-size:15px;margin-bottom:7px}
.note-card p{font-size:13.5px;color:#33364a}
.note-card p b{color:var(--ink)}

.sched{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:6px}
.sched th,.sched td{text-align:left;padding:10px 4px;border-top:1px solid var(--line);vertical-align:top}
.sched th{color:var(--muted);font-weight:500;width:58px}
.sched tr:first-child th,.sched tr:first-child td{border-top:0}

.macro{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,1fr);
  padding:15px 0;margin:8px 0 4px;
}
.macro > div{text-align:center;padding:0 6px;border-left:1px solid var(--line)}
.macro > div:first-child{border-left:0}
.macro .l{font-size:11px;color:var(--muted);letter-spacing:.02em}
.macro .v{font-family:"Oswald",sans-serif;font-size:20px;font-weight:600;margin-top:3px;letter-spacing:.01em}
.macro .v.a{color:var(--amber)}
.macro .v.b{color:var(--blue)}
.macro .v.t{font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:6px 12px}

/* builder */
.builder{background:var(--ink);color:#EDEEF5;border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.builder .brow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.builder .bkcal{font-family:"Oswald",sans-serif;font-size:38px;font-weight:600;color:var(--amber);line-height:1}
.builder .bkcal small{font-family:"Noto Sans TC",sans-serif;font-size:12.5px;color:#8A90A8;font-weight:400}
.builder .bcount{font-size:12px;color:#8A90A8;margin-top:4px}
.reset-btn{background:rgba(255,255,255,.08);border:none;color:#C7CBDE;font-size:12px;padding:8px 14px;border-radius:100px;font-family:"Noto Sans TC",sans-serif;white-space:nowrap}
.btags{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.btags .bchip{font-size:12px;background:rgba(245,165,36,.16);color:var(--amber);border-radius:100px;padding:5px 11px;font-weight:500}
.btags .empty{font-size:12.5px;color:#8A90A8}
.blist{margin-top:14px;border-top:1px solid rgba(255,255,255,.14);padding-top:4px}
.blist:empty{display:none}
.blist .bitem{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.blist .bitem:first-child{border-top:0}
.blist .bname{font-size:13.5px;font-weight:500;color:#EDEEF5}
.blist .bsub{font-size:11px;color:#8A90A8;margin-top:1px}
.blist .bkc{font-family:"Oswald",sans-serif;font-size:14px;font-weight:500;color:#8A90A8;white-space:nowrap}

.exo{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font-family:inherit;box-shadow:var(--shadow);transition:transform .12s ease}
.exo:active{transform:scale(.985)}
.exo .exo-l{display:flex;flex-direction:column;gap:2px}
.exo .exo-name{font-size:14px;font-weight:700}
.exo .exo-tags{font-size:11.5px;color:var(--muted)}
.exo .exo-r{font-family:"Oswald",sans-serif;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;padding-left:10px}
.exo.selected{border-color:var(--amber);background:var(--amber-soft)}
.exo.selected .exo-r{color:#B0730B}
.exo.cardio.selected{border-color:var(--blue);background:var(--blue-soft)}
.exo.cardio.selected .exo-r{color:var(--blue)}

.hint{font-size:12px;color:var(--muted);margin:-4px 0 14px;line-height:1.6}
.hint b{color:var(--ink)}
.disc{font-size:11.5px;color:var(--muted);padding:16px 4px 4px;border-top:1px solid var(--line);margin-top:10px;text-align:center;font-family:"Oswald",sans-serif;letter-spacing:.12em}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>向上訓練</h1><span class="sub">JUMP HIGHER</span></div>
  <div class="who" id="profile-summary"></div>
</header>

<div class="wrap">
  <section class="panel active" id="p-overview"></section>
  <section class="panel" id="p-train"></section>
  <section class="panel" id="p-templates"></section>
  <section class="panel" id="p-jump"></section>
  <section class="panel" id="p-diet"></section>
  <section class="panel" id="p-notes"></section>
</div>

<nav class="tabbar">
  <button class="tabbtn active" data-tab="p-overview">
    <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 9-10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="11" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="21" cy="5" r="1.3" fill="currentColor" stroke="none"/></svg>
    總覽
  </button>
  <button class="tabbtn" data-tab="p-train">
    <svg viewBox="0 0 24 24"><path d="M4 12h16M4 8v8M20 8v8M7 6v12M17 6v12" stroke-linecap="round"/></svg>
    訓練
  </button>
  <button class="tabbtn" data-tab="p-templates">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2.5" stroke-linejoin="round"/><path d="M3.5 9.5h17M8 4v5.5" stroke-linecap="round"/></svg>
    訓練模板
  </button>
  <button class="tabbtn" data-tab="p-jump">
    <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    爆發力
  </button>
  <button class="tabbtn" data-tab="p-diet">
    <svg viewBox="0 0 24 24"><path d="M5 3v7a3 3 0 003 3v8M5 3v5M7 3v5M9 3v5M9 3v18M18 3c-2 2-2 6-2 8s.5 3 2 3 2-1 2-3 0-6-2-8zM18 14v7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    飲食
  </button>
  <button class="tabbtn" data-tab="p-notes">
    <svg viewBox="0 0 24 24"><path d="M12 2l8 3.5v6c0 5-3.4 8.5-8 10.5-4.6-2-8-5.5-8-10.5v-6L12 2z" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v5" stroke-linecap="round"/><circle cx="12" cy="16.3" r="1" fill="currentColor" stroke="none"/></svg>
    注意
  </button>
</nav>

<script>
function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function renderOverview(profile) {
  var monthPositions = [45, 182, 320, 458, 595];
  var monthTicks = profile.months.map(function(item, index) {
    return '<text class="axis-tick" x="' + monthPositions[index] + '" y="167" text-anchor="middle">' + escapeHtml(item.month) + '</text>';
  }).join('');
  var monthChips = profile.months.map(function(item) {
    return '<div class="month-chip"><div class="m">' + escapeHtml(item.month) + '</div><div class="w">' + escapeHtml(item.weight) + '</div></div>';
  }).join('');
  var milestones = profile.milestones.map(function(item) {
    var tagClass = item.tone === 'blue' ? 'tag blue' : 'tag';
    return '<div class="card"><div class="card-h"><span class="name">' + escapeHtml(item.month + '・' + item.title) +
      '</span><span class="' + tagClass + '">' + escapeHtml(item.tag) + '</span></div><p>' +
      escapeHtml(item.description) + '</p><div class="row"><span>' + escapeHtml(item.checkLabel) +
      '</span><b>' + escapeHtml(item.checkValue) + '</b></div></div>';
  }).join('');
  var tracking = profile.tracking.map(function(item) {
    return '<b>' + escapeHtml(item.label) + '</b>：' + escapeHtml(item.text);
  }).join('<br>');

  document.getElementById('profile-summary').textContent = profile.summary;
  document.getElementById('p-overview').innerHTML =
    '<div class="hero"><p class="lead">' + escapeHtml(profile.lead) + '</p>' +
    '<div class="chart-head"><div class="chart-title">5-MONTH PROFILE</div><div class="legend"><span><i class="dot amber"></i>減脂強度</span><span><i class="dot blue"></i>爆發力空間</span></div></div>' +
    '<svg class="profile" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="45" y1="145" x2="595" y2="145" stroke="rgba(255,255,255,.12)" stroke-width="1"/>' +
    '<path d="M45,126 L182,119 L320,103 L458,80 L595,64" fill="none" stroke="#6D7BEF" stroke-width="2.5" stroke-dasharray="5 5"/>' +
    '<path d="M45,28 L182,35 L320,74 L458,109 L595,119" fill="none" stroke="#F5A524" stroke-width="3.5" stroke-linecap="round"/>' +
    '<circle cx="45" cy="28" r="4.5" fill="#F5A524"/><circle cx="182" cy="35" r="4.5" fill="#F5A524"/><circle cx="320" cy="74" r="4.5" fill="#F5A524"/><circle cx="458" cy="109" r="4.5" fill="#F5A524"/><circle cx="595" cy="119" r="4.5" fill="#F5A524"/>' +
    monthTicks + '</svg><div class="month-strip">' + monthChips + '</div></div>' +
    '<div class="stat-row"><div class="stat p"><div class="k">' + escapeHtml(profile.bodyGoal.label) +
    '</div><div class="v">' + escapeHtml(profile.bodyGoal.value) + '<small> ' + escapeHtml(profile.bodyGoal.unit) +
    '</small></div><div class="v2">' + escapeHtml(profile.bodyGoal.detail) + '</div></div>' +
    '<div class="stat s"><div class="k">' + escapeHtml(profile.jumpGoal.label) + '</div><div class="v">' +
    escapeHtml(profile.jumpGoal.value) + '<small> ' + escapeHtml(profile.jumpGoal.unit) +
    '</small></div><div class="v2">' + escapeHtml(profile.jumpGoal.detail) + '</div></div></div>' +
    '<div class="eyebrow">MILESTONES・月度里程碑</div>' + milestones +
    '<div class="eyebrow">TRACK・全程追蹤指標</div><div class="note-card"><h3>比體重更誠實的幾項</h3><p>' + tracking + '</p></div>';
}

function renderTraining(training) {
  var schedule = training.weeklySchedule.map(function(item) {
    return '<tr><th>' + escapeHtml(item.label) + '</th><td>' + escapeHtml(item.description) + '</td></tr>';
  }).join('');
  var groups = training.exerciseGroups.map(function(group) {
    var exercises = group.exercises.map(function(exercise) {
      var details = [exercise.dose, exercise.note].filter(Boolean).join('・');
      return '<button class="exo' + (group.cardio ? ' cardio' : '') + '" data-kcal="' + Number(exercise.calories) +
        '" data-tags="' + escapeHtml(exercise.muscleGroups.join(',')) + '"><span class="exo-l"><span class="exo-name">' +
        escapeHtml(exercise.name) + '</span><span class="exo-tags">' + escapeHtml(details) +
        '</span></span><span class="exo-r">' + Number(exercise.calories) + ' kcal</span></button>';
    }).join('');
    return '<div class="eyebrow">' + escapeHtml(group.name) + '</div>' + exercises;
  }).join('');
  var safetyRules = training.safetyRules.map(function(rule) {
    return '<b>' + escapeHtml(rule.title) + '</b>：' + escapeHtml(rule.description);
  }).join('<br>');

  document.getElementById('p-train').innerHTML =
    '<div class="eyebrow">WEEK・每週安排</div><div class="card" style="padding:6px 16px 8px"><table class="sched">' +
    schedule + '</table></div><div class="eyebrow">TODAY・今日菜單</div><div class="builder"><div class="brow"><div>' +
    '<div class="bkcal" id="sum-kcal">0<small> kcal</small></div><div class="bcount" id="sum-count">尚未選擇動作</div>' +
    '</div><button class="reset-btn" id="reset-today">清空</button></div><div class="btags" id="sum-tags">' +
    '<span class="empty">選好動作後，練到的肌群會列在這裡</span></div><div class="blist" id="sum-list"></div></div>' +
    '<p class="hint">' + escapeHtml(training.builderHint) + '</p>' + groups +
    '<div class="note-card warn" style="margin-top:16px"><h3>兩個安全鐵則</h3><p>' + safetyRules + '</p></div>';
}

function renderTemplates(trainingTemplates) {
  var days = trainingTemplates.days.map(function(day) {
    var exercises = day.exercises.map(function(exercise) {
      var note = exercise.note ? '<div class="note">' + escapeHtml(exercise.note) + '</div>' : '';
      return '<div class="ex"><div><div class="name">' + escapeHtml(exercise.name) + '</div>' + note +
        '</div><div class="dose">' + escapeHtml(exercise.dose) + '</div></div>';
    }).join('');
    return '<div class="day tmpl-day"><div class="day-h"><span class="code">' + escapeHtml(day.code) +
      '</span><span class="focus">' + escapeHtml(day.focus) + '</span></div>' + exercises + '</div>';
  }).join('');

  document.getElementById('p-templates').innerHTML =
  '<div class="eyebrow">TEMPLATE・每週課表模板</div>' +
  '<div class="note-card amber"><h3>' + escapeHtml(trainingTemplates.orderingNote.title) + '</h3><p>' +
  escapeHtml(trainingTemplates.orderingNote.description) + '</p></div>' +
  '<div class="note-card"><p>' + escapeHtml(trainingTemplates.intro) + '</p></div>' +
  days;
}

function renderJump(jumpTraining) {
  var target = jumpTraining.target;
  var menus = jumpTraining.menus.map(function(menu) {
    var exercises = menu.exercises.map(function(exercise) {
      var note = exercise.note ? '<div class="note">' + escapeHtml(exercise.note) + '</div>' : '';
      return '<div class="ex"><div><div class="name">' + escapeHtml(exercise.name) + '</div>' + note +
        '</div><div class="dose">' + escapeHtml(exercise.dose) + '</div></div>';
    }).join('');
    return '<div class="day"><div class="day-h"><span class="code">' + escapeHtml(menu.name) +
      '</span><span class="focus">' + escapeHtml(menu.condition) + '</span></div>' + exercises + '</div>';
  }).join('');
  var moves = jumpTraining.specialMoves.map(function(move) {
    return '<div class="card"><div class="card-h"><span class="name">' + escapeHtml(move.name) +
      '</span><span class="tag' + (move.tone === 'blue' ? ' blue' : '') + '">' + escapeHtml(move.tag) +
      '</span></div><p>' + escapeHtml(move.description) + '</p></div>';
  }).join('');
  var difference = target.netHeightCm - target.standingReachCm;

  document.getElementById('p-jump').innerHTML =
    '<div class="hero gauge-hero"><div class="gauge" id="gauge"><div class="track"><div class="fill" id="fill"></div></div>' +
    '<div class="zone" style="bottom:82%;height:11%"></div><div class="tick" style="bottom:60%"><i></i><b>摸高 ' +
    Number(target.standingReachCm) + '</b></div><div class="tick" style="bottom:82%"><i></i><b>女網 ' +
    Number(target.netHeightCm) + '</b></div><div class="tick" style="bottom:93%"><i></i><b>目標 ' +
    Number(target.targetMaxCm) + '</b></div></div><div class="gtxt"><div class="gk">TARGET</div><div class="gv">' +
    '從站立摸高 <b>' + Number(target.standingReachCm) + '</b> 到女網 <b>' + Number(target.netHeightCm) +
    '</b>，差距 ' + difference + 'cm；目標區設在 <b>' + Number(target.targetMinCm) + '–' +
    Number(target.targetMaxCm) + '</b>，對應垂直跳 <b>' + Number(target.verticalJumpMinCm) + '–' +
    Number(target.verticalJumpMaxCm) + 'cm</b>。</div><div class="grow">' + escapeHtml(target.note) +
    '</div></div></div><div class="eyebrow">MENU・當日菜單</div>' + menus +
    '<div class="eyebrow">SKILL・助跑摸高</div><div class="note-card amber"><h3>' +
    escapeHtml(jumpTraining.approachSkill.title) + '</h3><p>' + escapeHtml(jumpTraining.approachSkill.description) +
    '</p></div><div class="eyebrow">MOVES・專項動作</div>' + moves +
    '<div class="note-card amber"><h3>' + escapeHtml(jumpTraining.phaseNote.title) + '</h3><p>' +
    escapeHtml(jumpTraining.phaseNote.description) + '</p></div>';
}

function renderDiet(diet) {
  var targets = diet.dailyTargets.map(function(target) {
    var valueClass = 'v' + (target.tone === 'amber' ? ' a' : target.tone === 'blue' ? ' b t' : '');
    return '<div><div class="l">' + escapeHtml(target.label) + '</div><div class="' + valueClass + '">' +
      escapeHtml(target.value) + '</div></div>';
  }).join('');
  var meals = diet.meals.map(function(meal) {
    return '<b>' + escapeHtml(meal.name) + '</b>　' + escapeHtml(meal.description);
  }).join('<br>');
  var proteinSources = diet.proteinSources.map(function(source) {
    return '<span class="chip">' + escapeHtml(source) + '</span>';
  }).join('');
  var refuels = diet.refuelPlans.map(function(plan) {
    return '<div class="card"><div class="card-h"><span class="name">' + escapeHtml(plan.name) +
      '</span><span class="tag">' + escapeHtml(plan.burn) + '</span></div><p>' + escapeHtml(plan.targets) +
      '<br><span style="color:var(--muted)">例：' + escapeHtml(plan.example) + '</span></p></div>';
  }).join('');

  document.getElementById('p-diet').innerHTML =
    '<div class="eyebrow">DAILY・每日框架</div><div class="macro">' + targets +
    '</div><div class="note-card"><h3>三餐彈性抵換</h3><p>' + meals +
    '</p></div><div class="eyebrow">PROTEIN・蛋白質來源</div><div class="chips">' + proteinSources +
    '</div><div class="eyebrow">REFUEL・週末球類補充</div>' + refuels +
    '<div class="note-card good"><h3>' + escapeHtml(diet.strategy.title) + '</h3><p>' +
    escapeHtml(diet.strategy.description) + '</p></div>';
}

function renderRecovery(recovery) {
  var sections = recovery.sections.map(function(section) {
    var tone = section.tone === 'default' ? '' : ' ' + section.tone;
    return '<div class="eyebrow">' + escapeHtml(section.eyebrow) + '</div><div class="note-card' + tone +
      '"><h3>' + escapeHtml(section.title) + '</h3><p>' + escapeHtml(section.description) + '</p></div>';
  }).join('');
  document.getElementById('p-notes').innerHTML = sections + '<div class="disc">向上訓練・自用版</div>';
}

function updateSummary() {
  var selected = document.querySelectorAll('.exo.selected');
  var kcal = 0;
  var tagsSet = new Set();
  selected.forEach(function(el) {
    kcal += parseInt(el.dataset.kcal, 10);
    el.dataset.tags.split(',').forEach(function(tag) { tagsSet.add(tag); });
  });
  document.getElementById('sum-kcal').innerHTML = kcal + '<small> kcal</small>';
  document.getElementById('sum-count').textContent = selected.length ? ('已選 ' + selected.length + ' 項動作') : '尚未選擇動作';
  var tagsEl = document.getElementById('sum-tags');
  tagsEl.innerHTML = tagsSet.size
    ? Array.from(tagsSet).map(function(tag) { return '<span class="bchip">' + escapeHtml(tag) + '</span>'; }).join('')
    : '<span class="empty">選好動作後，練到的肌群會列在這裡</span>';
  document.getElementById('sum-list').innerHTML = Array.from(selected).map(function(el) {
    var name = el.querySelector('.exo-name').textContent;
    var sub = el.querySelector('.exo-tags').textContent;
    return '<div class="bitem"><div><div class="bname">' + escapeHtml(name) + '</div><div class="bsub">' +
      escapeHtml(sub) + '</div></div><div class="bkc">' + Number(el.dataset.kcal) + ' kcal</div></div>';
  }).join('');
}

function bindInteractions(gaugePercent) {
  var fillEl = document.getElementById('fill');
  function runGauge() {
    if (fillEl) fillEl.style.height = Number(gaugePercent) + '%';
  }
  setTimeout(runGauge, 250);
  document.querySelectorAll('.tabbtn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tabbtn').forEach(function(item) { item.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(panel) { panel.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      window.scrollTo(0, 0);
      if (btn.dataset.tab === 'p-jump' && fillEl) {
        fillEl.style.height = '0%';
        setTimeout(runGauge, 60);
      }
    });
  });
  document.querySelectorAll('.exo').forEach(function(exercise) {
    exercise.addEventListener('click', function() {
      exercise.classList.toggle('selected');
      updateSummary();
    });
  });
  document.getElementById('reset-today').addEventListener('click', function() {
    document.querySelectorAll('.exo.selected').forEach(function(exercise) { exercise.classList.remove('selected'); });
    updateSummary();
  });
  updateSummary();
}

fetch('./plan.json', { cache: 'no-store' })
  .then(function(response) {
    if (!response.ok) throw new Error('無法載入 plan.json（HTTP ' + response.status + '）');
    return response.json();
  })
  .then(function(plan) {
    renderOverview(plan.profile);
    renderTraining(plan.training);
    renderTemplates(plan.trainingTemplates);
    renderJump(plan.jumpTraining);
    renderDiet(plan.diet);
    renderRecovery(plan.recovery);
    bindInteractions(plan.jumpTraining.target.gaugePercent);
  })
  .catch(function(error) {
    document.querySelector('.wrap').innerHTML =
      '<div class="note-card warn"><h3>訓練計畫載入失敗</h3><p>' + escapeHtml(error.message) +
      '。請確認 plan.json 與 index.html 位於相同目錄，並透過網站伺服器開啟。</p></div>';
    console.error(error);
  });
</script>

</body>
</html>
