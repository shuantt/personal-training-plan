<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>向上訓練</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="向上訓練">
<meta name="theme-color" content="#F3F4F1">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/apple-touch-icon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="manifest" href='data:application/manifest+json,{"name":"向上訓練","short_name":"向上訓練","display":"standalone","background_color":"%23F3F4F1","theme_color":"%23F3F4F1","start_url":"/","icons":[{"src":"/apple-touch-icon.png","sizes":"192x192","type":"image/png","purpose":"any"}]}'>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#15172A;
  --paper:#F3F4F1;
  --surface:#FFFFFF;
  --line:#E4E5E0;
  --muted:#6A6F82;
  --blue:#2C43D8;
  --blue-soft:#E9ECFF;
  --amber:#F5A524;
  --amber-strong:#C2570D;
  --amber-soft:#FCEFD4;
  --good:#159C73;
  --shadow:0 1px 2px rgba(21,23,42,.04),0 8px 24px rgba(21,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans TC",-apple-system,system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:100px;
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  padding-top:env(safe-area-inset-top,0px);
}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}

/* header */
header{
  padding:18px 18px 10px;
  max-width:600px;margin:0 auto;
}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:"Oswald",sans-serif;font-weight:600;font-size:28px;letter-spacing:.05em;line-height:1.1}
.brand .sub{font-family:"Oswald",sans-serif;font-weight:500;font-size:12px;letter-spacing:.2em;color:var(--blue)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{margin-top:4px;font-size:12.5px;color:var(--muted)}
.lang-btn{flex:0 0 auto;background:var(--ink);color:#EDEEF5;border:none;font-family:"Oswald",sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;padding:8px 14px;border-radius:100px;box-shadow:var(--shadow)}
.lang-btn:active{transform:scale(.96)}

/* hero dark card */
.hero{
  background:var(--ink);color:#EDEEF5;border-radius:22px;
  padding:20px;box-shadow:var(--shadow);margin-bottom:14px;
}
.hero .lead{font-size:14.5px;line-height:1.65;color:#C7CBDE;margin-bottom:16px}
.hero .lead b{color:#fff;font-weight:700}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.chart-title{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.14em;color:#8A90A8}
.legend{display:flex;gap:12px;font-size:11px;color:#8A90A8}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* primary goals */
.goal-board{background:var(--ink);color:#EDEEF5;border-radius:22px;padding:20px;margin-bottom:8px;box-shadow:var(--shadow)}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.goal-kicker{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.16em;color:var(--amber)}
.goal-period{font-family:"Oswald",sans-serif;font-size:11px;color:#8A90A8}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}
.goal-item{padding:16px 14px 16px 0;min-width:0}
.goal-item + .goal-item{border-left:1px solid rgba(255,255,255,.12);padding-left:18px;padding-right:0}
.goal-label{font-size:11.5px;color:#8A90A8;margin-bottom:3px}
.goal-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal-metric{min-width:0}
.goal-metric + .goal-metric{border-left:1px solid rgba(255,255,255,.1);padding-left:10px}
.goal-value{font-family:"Oswald",sans-serif;font-size:46px;font-weight:600;line-height:1;color:#fff}
.goal-value.weight{color:var(--amber)}
.goal-value.jump{color:#8793FF}
.goal-value small{font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:400;color:#8A90A8;margin-left:4px}
.goal-value.range{font-size:30px;line-height:1.25;white-space:nowrap;margin-top:8px}
.goal-value.range .arrow{font-size:18px;color:#8A90A8;margin:0 3px}
.goal-caption{font-size:10.5px;color:#8A90A8;margin-top:7px;line-height:1.35}
.goal-meta{font-size:11.5px;color:#C7CBDE;margin-top:8px;line-height:1.45}

/* overview progress */
.progress-card{background:var(--ink);color:#EDEEF5;border-radius:22px;padding:18px 18px 16px;margin:14px 0 6px;box-shadow:var(--shadow)}
.progress-card .chart-head{margin-bottom:12px}
.progress-card .dot.weight{background:var(--amber)}
.progress-card .dot.body-fat{background:#6FCF97}
.progress-card .line-key{width:13px;height:0;border-top:2px solid #8A90A8;display:inline-block}
.progress-card .line-key.target{border-top-style:dashed}
.progress-legend{display:grid;grid-template-columns:auto auto;justify-content:start;gap:5px 16px;font-size:10.5px;color:#8A90A8;margin-bottom:8px}
.progress-legend span{display:inline-flex;align-items:center;gap:5px}
.progress-chart{width:100%;height:auto;display:block;overflow:visible}
.progress-grid{stroke:rgba(255,255,255,.1);stroke-width:1}
.progress-axis{font-family:"Oswald",sans-serif;font-size:10px;fill:#8A90A8}
.progress-axis.weight-axis{fill:#D89524}
.progress-axis.body-fat-axis{fill:#55B986}
.progress-axis-unit{font-family:"Oswald",sans-serif;font-size:10px;font-weight:600}
.progress-axis-unit.weight-axis{fill:#D89524}
.progress-axis-unit.body-fat-axis{fill:#55B986}
.progress-value{font-family:"Oswald",sans-serif;font-size:11px;font-weight:600}
.progress-latest{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding-top:12px}
.progress-latest .label{font-size:11px;color:#8A90A8}
.progress-latest .value{font-family:"Oswald",sans-serif;font-size:22px;font-weight:600;color:#fff;white-space:nowrap}
.progress-latest .value small{font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:400;color:#8A90A8}
.progress-summaries{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.12);margin-top:8px}
.progress-summary{padding:12px 12px 0 0;min-width:0}
.progress-summary + .progress-summary{border-left:1px solid rgba(255,255,255,.12);padding-left:14px;padding-right:0}
.progress-summary .label{font-size:10.5px;color:#8A90A8}
.progress-summary .value{font-family:"Oswald",sans-serif;font-size:24px;font-weight:600;color:#fff;white-space:nowrap}
.progress-summary.weight .value{color:var(--amber)}
.progress-summary.body-fat .value{color:#6FCF97}
.progress-summary .value small{font-family:"Noto Sans TC",sans-serif;font-size:10.5px;font-weight:400;color:#8A90A8}
.progress-delta{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:10.5px;font-weight:700;color:#6FCF97;margin-left:5px;vertical-align:middle}
.progress-delta.down{color:#E08A8A}
.progress-delta.neutral{color:#8A90A8}
.progress-card .hist-panel .hrow{grid-template-columns:52px repeat(2,1fr)}
.progress-card .hist-panel .hrow small{display:block;color:#8A90A8;font-size:9.5px;margin-top:1px}

/* gauge hero — gauge has no fixed height; grid stretch makes it
   match the height of the text column automatically (top aligns
   with TARGET, bottom aligns with whatever is currently the last
   line in that column) */
.gauge-hero{display:grid;grid-template-columns:auto 1fr;gap:40px}
.gauge{position:relative;width:92px}
.gauge .track{position:absolute;right:2px;top:0;bottom:0;width:10px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden}
.gauge .fill{position:absolute;left:0;bottom:0;width:100%;background:linear-gradient(180deg,#5B6BF0,#2C43D8);height:0;border-radius:6px;transition:height 1.1s cubic-bezier(.2,.8,.2,1) .25s}
.gauge .zone{position:absolute;right:2px;width:10px;border-radius:6px;background:repeating-linear-gradient(180deg,var(--amber) 0 5px,transparent 5px 10px);opacity:.9}
.gauge .tick{position:absolute;right:0;width:92px;height:0}
.gauge .tick i{position:absolute;right:14px;width:14px;height:2px;background:rgba(255,255,255,.35);top:-1px}
.gauge .tick b{position:absolute;right:32px;top:-9px;font-family:"Oswald",sans-serif;font-weight:600;font-size:12px;color:#C7CBDE;white-space:nowrap}
.gtxt .gk{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.14em;color:var(--amber);margin-bottom:6px}
.gtxt .gv{font-size:14px;line-height:1.6;color:#C7CBDE}
.gtxt .gv b{color:#fff}
.gtxt .tests{border-top:1px solid rgba(255,255,255,.12);padding-top:11px;margin-top:11px}
.gtxt .tests-label{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.14em;color:var(--amber);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px}
.gtxt .tests-label .delta{font-family:"Noto Sans TC",sans-serif;font-size:10.5px;color:#6FCF97;font-weight:500;letter-spacing:0}
.gtxt .tests-label .delta.down{color:#E08A8A}
.gtxt .tests-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gtxt .tests-row .ti{text-align:left}
.gtxt .tests-row .tv{font-family:"Oswald",sans-serif;font-size:18px;font-weight:600;color:#fff;line-height:1.1}
.gtxt .tests-row .tv small{font-family:"Noto Sans TC",sans-serif;font-size:10.5px;color:#8A90A8;font-weight:400;margin-left:1px}
.gtxt .tests-row .tl{font-size:10.5px;color:#8A90A8;margin-top:3px;line-height:1.3}
.gtxt .spark-wrap{margin-top:11px;border-top:1px solid rgba(255,255,255,.12);padding-top:11px}
.gtxt .spark-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;gap:4px}
.gtxt .spark-label{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.14em;color:var(--amber)}
.gtxt .spark-legend{display:flex;gap:10px;font-size:10px;color:#8A90A8}
.gtxt .spark-legend span{display:inline-flex;align-items:center;gap:4px}
.gtxt .spark-legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
svg.spark{width:100%;height:auto;display:block;margin-top:2px}
.gtxt .spark-empty{font-size:12px;color:#8A90A8;padding:4px 0 2px}

/* history toggle sits inside .gtxt (so the gauge matches up to
   here) — the panel it reveals is a SIBLING of .gauge-hero, so
   expanding it never changes the gauge's height */
.hist-toggle{
  margin-top:11px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);
  background:none;border-left:none;border-right:none;border-bottom:none;
  font-family:"Noto Sans TC",sans-serif;font-size:12px;color:#C7CBDE;
  display:flex;align-items:center;gap:5px;cursor:pointer;width:100%;text-align:left;padding-left:0;padding-right:0;
}
.hist-toggle .arrow{transition:transform .2s ease;font-size:10px;display:inline-block}
.hist-toggle.open .arrow{transform:rotate(90deg)}
.hist-panel{display:none}
.hist-panel.open{display:block}
.hist-panel-inner{border-top:1px solid rgba(255,255,255,.12);margin-top:14px;padding-top:12px}
.hist-panel .hrow{display:grid;grid-template-columns:40px repeat(3,1fr);gap:10px;font-size:12px;color:#C7CBDE;padding:6px 0;border-top:1px solid rgba(255,255,255,.08)}
.hist-panel .hrow:first-child{border-top:0;color:#8A90A8;font-size:10.5px}
.hist-panel .hrow b{color:#fff;font-weight:500}
.hist-panel .hrow div:nth-child(n+2){text-align:right}

/* tabs */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;display:flex;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 2px calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:calc(2px + env(safe-area-inset-left,0px));
  padding-right:calc(2px + env(safe-area-inset-right,0px));
  z-index:9999;transform:translate3d(0,0,0);
}
.tabbtn{flex:1;background:none;border:none;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;border-radius:12px}
.tabbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}
.tabbtn.active{color:var(--blue)}

.panel{display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.eyebrow{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.16em;color:var(--blue);margin:24px 0 9px}
.eyebrow:first-child{margin-top:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.card-h .name{font-size:15.5px;font-weight:700}
.card-h .tag{font-family:"Oswald",sans-serif;font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:3px 10px;border-radius:100px;white-space:nowrap}
.card-h .tag.blue{color:var(--blue);background:var(--blue-soft)}
.card p{font-size:13.5px;color:#33364a}
.card .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:9px;padding-top:8px}
.card .row b{color:var(--ink);font-family:"Oswald",sans-serif;font-weight:600;font-size:13px}

.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 15px 5px;margin-bottom:12px;box-shadow:var(--shadow)}
.day-h{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.day-h .code{font-family:"Oswald",sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;color:#fff;background:var(--blue);padding:4px 11px;border-radius:100px}
.tmpl-day .day-h .code{background:var(--amber-strong)}
.day-h .focus{font-size:12.5px;color:var(--muted)}
details.day{padding-bottom:15px}
details.day[open]{padding-bottom:5px}
details.day summary.day-h{cursor:pointer;list-style:none;margin-bottom:0}
details.day summary.day-h::-webkit-details-marker{display:none}
.day-h .day-arrow{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .2s ease;flex:0 0 auto}
details.day[open] .day-h .day-arrow{transform:rotate(90deg)}
.day-body{margin-top:6px}
.ex{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex .name{font-size:14px;font-weight:700}
.ex .note{font-size:12px;color:var(--muted);margin-top:2px}
.ex .dose{font-family:"Oswald",sans-serif;font-size:15px;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.ex .dose small{color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:400}

.note-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--blue)}
.note-card.amber{border-left-color:var(--amber)}
.note-card.warn{border-left-color:#C0392B}
.note-card.good{border-left-color:var(--good)}
.note-card h3{font-size:15px;margin-bottom:7px}
.note-card p{font-size:13.5px;color:#33364a}
.note-card p b{color:var(--ink)}

.sched{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:6px}
.sched th,.sched td{text-align:left;padding:10px 4px;border-top:1px solid var(--line);vertical-align:top}
.sched th{color:var(--muted);font-weight:500;width:58px}
.sched tr:first-child th,.sched tr:first-child td{border-top:0}
.schedule-card{background:var(--ink);color:#EDEEF5;border-radius:18px;padding:6px 16px 8px;margin-bottom:12px;box-shadow:var(--shadow)}
.schedule-card .sched th,.schedule-card .sched td{border-top-color:rgba(255,255,255,.12)}
.schedule-card .sched th{color:var(--amber)}
.schedule-card .sched td{color:#C7CBDE}

.macro{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,1fr);
  padding:15px 0;margin:8px 0 4px;
}
.macro > div{text-align:center;padding:0 6px;border-left:1px solid var(--line)}
.macro > div:first-child{border-left:0}
.macro .l{font-size:11px;color:var(--muted);letter-spacing:.02em}
.macro .v{font-family:"Oswald",sans-serif;font-size:20px;font-weight:600;margin-top:3px;letter-spacing:.01em}
.macro .v.a{color:var(--amber)}
.macro .v.b{color:var(--blue)}
.macro .v.t{font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:6px 12px}

/* builder */
.builder{background:var(--ink);color:#EDEEF5;border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.builder .brow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.builder .bkcal{font-family:"Oswald",sans-serif;font-size:38px;font-weight:600;color:var(--amber);line-height:1}
.builder .bkcal small{font-family:"Noto Sans TC",sans-serif;font-size:12.5px;color:#8A90A8;font-weight:400}
.builder .bcount{font-size:12px;color:#8A90A8;margin-top:4px}
.reset-btn{background:rgba(255,255,255,.08);border:none;color:#C7CBDE;font-size:12px;padding:8px 14px;border-radius:100px;font-family:"Noto Sans TC",sans-serif;white-space:nowrap}
.btags{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.btags .bchip{font-size:12px;background:rgba(245,165,36,.16);color:var(--amber);border-radius:100px;padding:5px 11px;font-weight:500}
.btags .empty{font-size:12.5px;color:#8A90A8}
.blist{margin-top:14px;border-top:1px solid rgba(255,255,255,.14);padding-top:4px}
.blist:empty{display:none}
.blist .bitem{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.blist .bitem:first-child{border-top:0}
.blist .bname{font-size:13.5px;font-weight:500;color:#EDEEF5}
.blist .bsub{font-size:11px;color:#8A90A8;margin-top:1px}
.blist .bkc{font-family:"Oswald",sans-serif;font-size:14px;font-weight:500;color:#8A90A8;white-space:nowrap}

.exo{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font-family:inherit;box-shadow:var(--shadow);transition:transform .12s ease}
.exo:active{transform:scale(.985)}
.exo .exo-l{display:flex;flex-direction:column;gap:2px}
.exo .exo-name{font-size:14px;font-weight:700}
.exo .exo-tags{font-size:11.5px;color:var(--muted)}
.exo .exo-r{font-family:"Oswald",sans-serif;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;padding-left:10px}
.exo.selected{border-color:var(--amber);background:var(--amber-soft)}
.exo.selected .exo-r{color:#B0730B}
.exo.cardio.selected{border-color:var(--blue);background:var(--blue-soft)}
.exo.cardio.selected .exo-r{color:var(--blue)}

.tmpl-pick-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.tmpl-pick{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:"Oswald",sans-serif;font-weight:600;font-size:14px;letter-spacing:.04em;padding:9px 17px;border-radius:100px;box-shadow:var(--shadow)}
.tmpl-pick:active{transform:scale(.96)}
.tmpl-pick.active{background:var(--ink);color:#fff;border-color:var(--ink)}
#tmpl-import-list{display:none}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function progressDelta(records, recordIndex) {
  var current = records[recordIndex];
  if (!current || typeof current.actual !== 'number') return null;
  var currentDisplay = Number(current.actualDisplay);
  var currentValue = Number.isFinite(currentDisplay) ? currentDisplay : current.actual;
  for (var index = recordIndex - 1; index >= 0; index -= 1) {
    if (typeof records[index].actual === 'number') {
      var previousDisplay = Number(records[index].actualDisplay);
      var previousValue = Number.isFinite(previousDisplay) ? previousDisplay : records[index].actual;
      return currentValue - previousValue;
    }
  }
  return null;
}

function formatProgressDelta(delta, unit) {
  if (delta === null) return '';
  var rounded = Math.round(delta * 10) / 10;
  var value = Math.abs(rounded).toFixed(1).replace('.0', '');
  var prefix = rounded > 0 ? '+' : rounded < 0 ? '-' : '';
  var tone = rounded < 0 ? ' down' : rounded === 0 ? ' neutral' : '';
  return '<span class="progress-delta' + tone + '">(' + prefix + value + unit + ')</span>';
}

function buildCombinedProgressChart(weightRecords, bodyFatRecords, t) {
  var width = 560, height = 230, left = 36, right = 36, top = 30, bottom = 34;
  var innerWidth = width - left - right, innerHeight = height - top - bottom;
  function rangeFor(records) {
    var values = [];
    records.forEach(function(record) {
      if (typeof record.target === 'number') values.push(record.target);
      if (typeof record.actual === 'number') values.push(record.actual);
    });
    var min = Math.floor(Math.min.apply(null, values)) - 1;
    var max = Math.ceil(Math.max.apply(null, values)) + 1;
    return { min: min, max: max };
  }
  var weightRange = rangeFor(weightRecords);
  var bodyFatRange = rangeFor(bodyFatRecords);
  function point(value, index, range) {
    var x = left + (weightRecords.length === 1 ? innerWidth / 2 : index * innerWidth / (weightRecords.length - 1));
    var y = top + (range.max - value) / (range.max - range.min) * innerHeight;
    return { x: x, y: y };
  }
  function recordIndex(record) {
    return weightRecords.map(function(item) { return item.month; }).indexOf(record.month);
  }
  function seriesHtml(records, range, color, targetDash) {
    var targets = records.filter(function(record) { return typeof record.target === 'number'; });
    var actuals = records.filter(function(record) { return typeof record.actual === 'number'; });
    var targetPoints = targets.map(function(record) {
      var p = point(record.target, recordIndex(record), range);
      return p.x.toFixed(1) + ',' + p.y.toFixed(1);
    });
    var actualPoints = actuals.map(function(record) {
      var p = point(record.actual, recordIndex(record), range);
      return p.x.toFixed(1) + ',' + p.y.toFixed(1);
    });
    var html = targetPoints.length > 1 ? '<polyline points="' + targetPoints.join(' ') + '" fill="none" stroke="' + color +
      '" stroke-width="2" stroke-opacity=".72" stroke-dasharray="' + targetDash + '" stroke-linecap="round" stroke-linejoin="round"/>' : '';
    html += targets.map(function(record) {
      var p = point(record.target, recordIndex(record), range);
      return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="2.8" fill="#15172A" stroke="' + color + '" stroke-opacity=".78" stroke-width="1.7"/>';
    }).join('');
    if (actualPoints.length > 1) html += '<polyline points="' + actualPoints.join(' ') + '" fill="none" stroke="' + color +
      '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>';
    html += actuals.map(function(record) {
      var p = point(record.actual, recordIndex(record), range);
      var displayValue = record.actualDisplay || String(record.actual);
      return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5" fill="' + color + '" stroke="#EDEEF5" stroke-width="2"><title>' +
        escapeHtml(record.month + ' ' + displayValue) + '</title></circle>';
    }).join('');
    return html;
  }

  var grid = '';
  for (var tick = 0; tick <= 4; tick += 1) {
    var y = top + innerHeight * tick / 4;
    var weightTick = weightRange.max - (weightRange.max - weightRange.min) * tick / 4;
    var bodyFatTick = bodyFatRange.max - (bodyFatRange.max - bodyFatRange.min) * tick / 4;
    grid += '<line class="progress-grid" x1="' + left + '" y1="' + y.toFixed(1) + '" x2="' + (width - right) + '" y2="' + y.toFixed(1) + '"/>' +
      '<text class="progress-axis weight-axis" x="' + (left - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + weightTick.toFixed(0) + '</text>' +
      '<text class="progress-axis body-fat-axis" x="' + (width - right + 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="start">' + bodyFatTick.toFixed(0) + '</text>';
  }
  var dates = weightRecords.map(function(record, index) {
    var p = point(weightRange.min, index, weightRange);
    return '<text class="progress-axis" x="' + p.x.toFixed(1) + '" y="' + (height - 8) + '" text-anchor="middle">' + escapeHtml(record.month) + '</text>';
  }).join('');
  return '<div class="chart-head"><div class="chart-title">' + escapeHtml(t.progressCombinedTitle) + '</div></div>' +
    '<div class="progress-legend"><span><i class="dot weight"></i>' + escapeHtml(t.goalWeightLabel) + '</span><span><i class="dot body-fat"></i>' + escapeHtml(t.goalBodyFatLabel) +
    '</span><span><i class="line-key target"></i>' + escapeHtml(t.progressTarget) + '</span><span><i class="line-key"></i>' + escapeHtml(t.progressActual) + '</span></div>' +
    '<svg class="progress-chart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="' + escapeHtml(t.progressCombinedTitle) +
    '" xmlns="http://www.w3.org/2000/svg"><text class="progress-axis-unit weight-axis" x="' + left + '" y="12">kg</text>' +
    '<text class="progress-axis-unit body-fat-axis" x="' + (width - right) + '" y="12" text-anchor="end">%</text>' + grid +
    seriesHtml(weightRecords, weightRange, '#F5A524', '8 6') + seriesHtml(bodyFatRecords, bodyFatRange, '#6FCF97', '2 5') + dates + '</svg>';
}

function latestProgressSummary(records, label, unit, metricClass, t) {
  var latestIndex = -1;
  records.forEach(function(record, index) { if (typeof record.actual === 'number') latestIndex = index; });
  if (latestIndex < 0) return '';
  var latest = records[latestIndex];
  var previous = null;
  for (var index = latestIndex - 1; index >= 0; index -= 1) {
    if (typeof records[index].actual === 'number') { previous = records[index]; break; }
  }
  var displayValue = latest.actualDisplay || String(latest.actual);
  var periodLabel = previous ? latest.month + ' vs ' + previous.month : t.progressLatestLabel(latest.month);
  return '<div class="progress-summary ' + metricClass + '"><div class="label">' + escapeHtml(label + '・' + periodLabel) + '</div><div class="value">' +
    escapeHtml(displayValue) + '<small> ' + escapeHtml(unit) + '</small>' + formatProgressDelta(progressDelta(records, latestIndex), unit) + '</div></div>';
}

function buildProgressHistoryHtml(progressHistory, t) {
  if (!progressHistory || !progressHistory.records || !progressHistory.records.length) return '';
  var records = progressHistory.records;
  var bodyFatRecords = progressHistory.bodyFatRecords || [];
  var summaries = latestProgressSummary(records, t.goalWeightLabel, 'kg', 'weight', t) + latestProgressSummary(bodyFatRecords, t.goalBodyFatLabel, '%', 'body-fat', t);
  var rows = records.map(function(record, index) {
    var bodyFatIndex = bodyFatRecords.map(function(item) { return item.month; }).indexOf(record.month);
    var bodyFatRecord = bodyFatRecords[bodyFatIndex] || {};
    var weightActual = typeof record.actual === 'number' ? (record.actualDisplay || record.actual) : t.progressNoRecord;
    var bodyFatActual = typeof bodyFatRecord.actual === 'number' ? (bodyFatRecord.actualDisplay || bodyFatRecord.actual) : t.progressNoRecord;
    return '<div class="hrow"><div>' + escapeHtml(record.month) + '</div><div><b>' + escapeHtml(String(record.target)) + ' / ' + escapeHtml(String(weightActual)) +
      formatProgressDelta(progressDelta(records, index), '') + '</b><small>kg</small></div><div><b>' + escapeHtml(String(bodyFatRecord.target)) + ' / ' + escapeHtml(String(bodyFatActual)) +
      formatProgressDelta(progressDelta(bodyFatRecords, bodyFatIndex), '%') + '</b></div></div>';
  }).join('');
  return '<div class="eyebrow">' + escapeHtml(t.progressEyebrow) + '</div><div class="progress-card">' +
    buildCombinedProgressChart(records, bodyFatRecords, t) + '<div class="progress-summaries">' + summaries + '</div>' +
    '<button class="hist-toggle" type="button" id="progress-hist-toggle"><span class="arrow">▸</span> ' + escapeHtml(t.progressHistoryToggle) + '</button>' +
    '<div class="hist-panel" id="progress-hist-panel"><div class="hist-panel-inner"><div class="hrow"><div>' + escapeHtml(t.progressMonthCol) +
    '</div><div>' + escapeHtml(t.progressWeightHistory) + '</div><div>' + escapeHtml(t.progressBodyFatHistory) + '</div></div>' + rows + '</div></div></div>';
}

      '</span><b>' + escapeHtml(item.checkValue) + '</b></div></div>';
  }).join('');
  var tracking = profile.tracking.map(function(item) {
    return '<b>' + escapeHtml(item.label) + '</b>：' + escapeHtml(item.text);
  }).join('<br>');
  var progressHistory = buildProgressHistoryHtml(profile.progressHistory, t);

  document.getElementById('profile-summary').textContent = profile.summary;
  document.getElementById('p-overview').innerHTML =
    '<div class="goal-board"><div class="goal-top"><div class="goal-kicker">' + escapeHtml(t.goalHeading) + '</div><div class="goal-period">' + escapeHtml(profile.goalPeriod) + '</div></div>' +
    '<div class="goal-grid"><div class="goal-item"><div class="goal-label">' + escapeHtml(t.goalBodyLabel) + '</div><div class="goal-metrics">' +
    '<div class="goal-metric"><div class="goal-value weight">' + escapeHtml(String(profile.bodyGoal.target)) + '<small>' + escapeHtml(profile.bodyGoal.unit) + '</small></div>' +
    '<div class="goal-caption">' + escapeHtml(t.goalWeightLabel) + ' ' + escapeHtml(String(profile.bodyGoal.current)) + ' →</div></div>' +
    '<div class="goal-metric"><div class="goal-value weight">' + escapeHtml(String(profile.bodyGoal.bodyFatTarget)) + '<small>%</small></div>' +
    '<div class="goal-caption">' + escapeHtml(t.goalBodyFatLabel) + ' ' + escapeHtml(String(profile.bodyGoal.bodyFatCurrent)) + ' →</div></div></div></div>' +
    '<div class="goal-item"><div class="goal-label">' + escapeHtml(profile.jumpGoal.label) + '</div>' +
    '<div class="goal-value range jump">' + escapeHtml(String(profile.jumpGoal.current)) + '<span class="arrow">→</span>' + escapeHtml(String(profile.jumpGoal.target)) + '<small>' + escapeHtml(profile.jumpGoal.unit) + '</small></div>' +
    '<div class="goal-meta">' + escapeHtml(t.goalVerticalRange) + ' +' + escapeHtml(String(profile.jumpGoal.currentVerticalCm)) + ' → +' + escapeHtml(String(profile.jumpGoal.targetVerticalCm)) + ' cm<br>' +
    escapeHtml(t.goalStandingReach) + ' ' + escapeHtml(String(profile.jumpGoal.standingReachCm)) + ' cm・' + escapeHtml(t.goalArmSwingReach) + ' ' + escapeHtml(String(profile.jumpGoal.armSwingReachCm)) + ' cm (+30)</div></div></div></div>' +
    progressHistory +
    '<div class="eyebrow">' + escapeHtml(t.milestonesEyebrow) + '</div>' + milestones +
    '<div class="eyebrow">' + escapeHtml(t.trackEyebrow) + '</div><div class="note-card"><h3>' + escapeHtml(t.trackCardTitle) + '</h3><p>' + tracking + '</p></div>';

  var progressToggle = document.getElementById('progress-hist-toggle');
  if (progressToggle) {
    progressToggle.addEventListener('click', function() {
      var panel = document.getElementById('progress-hist-panel');
      var isOpen = panel.classList.toggle('open');
      progressToggle.classList.toggle('open', isOpen);
    });
  }
}

    escapeHtml(details) + '</span></span><span class="exo-r">' + Number(calories) + ' ' + escapeHtml(t.kcal) + '</span></button>';
}

function renderTraining(training, trainingTemplates, t) {
  var schedule = training.weeklySchedule.map(function(item) {
    return '<tr><th>' + escapeHtml(item.label) + '</th><td>' + escapeHtml(item.description) + '</td></tr>';
  }).join('');
  var groups = training.exerciseGroups.map(function(group) {
    var exercises = group.exercises.map(function(exercise) {
      return exoButtonHtml(exercise.name, exercise.note, exercise.dose, exercise.calories, exercise.muscleGroups, group.cardio, t, false);
    }).join('');
    return '<div class="eyebrow">' + escapeHtml(group.name) + '</div>' + exercises;
  }).join('');
  var safetyRules = training.safetyRules.map(function(rule) {
    return '<b>' + escapeHtml(rule.title) + '</b>：' + escapeHtml(rule.description);
  }).join('<br>');

  var templatePicks = TEMPLATE_IMPORT_ORDER.map(function(code) {
    var label = (t.templateImportDays && t.templateImportDays[code]) || code;
    return '<button class="tmpl-pick" type="button" data-day="' + code + '">' + escapeHtml(label) + '</button>';
  }).join('');

  document.getElementById('p-train').innerHTML =
    '<div class="eyebrow">' + escapeHtml(t.weekEyebrow) + '</div><div class="schedule-card"><table class="sched">' +
    schedule + '</table></div>' +
    '<div class="eyebrow">' + escapeHtml(t.todayEyebrow) + '</div><div class="builder"><div class="brow"><div>' +
    '<div class="bkcal" id="sum-kcal">0<small> ' + escapeHtml(t.kcal) + '</small></div><div class="bcount" id="sum-count">' + escapeHtml(t.notSelected) + '</div>' +
    '</div><button class="reset-btn" id="reset-today">' + escapeHtml(t.resetBtn) + '</button></div><div class="btags" id="sum-tags">' +
    '<span class="empty">' + escapeHtml(t.emptyTags) + '</span></div><div class="blist" id="sum-list"></div></div>' +
    '<p class="hint">' + escapeHtml(training.builderHint) + '</p>' +
    '<div class="tmpl-pick-row" id="tmpl-pick-row">' + templatePicks + '</div><div id="tmpl-import-list"></div>' +
    groups +
    '<div class="note-card warn" style="margin-top:16px"><h3>' + escapeHtml(t.safetyTitle) + '</h3><p>' + safetyRules + '</p></div>';

  bindTemplateImport(trainingTemplates, t);
}

function clearTemplateImport() {
  var list = document.getElementById('tmpl-import-list');
  if (list) list.innerHTML = '';
  document.querySelectorAll('.tmpl-pick').forEach(function(btn) { btn.classList.remove('active'); });
}

function importTemplateDay(code, trainingTemplates, t) {
  document.querySelectorAll('.exo.selected').forEach(function(el) { el.classList.remove('selected'); });
  clearTemplateImport();
  var pickBtn = document.querySelector('.tmpl-pick[data-day="' + code + '"]');
  if (pickBtn) pickBtn.classList.add('active');
  var list = document.getElementById('tmpl-import-list');
  var day = trainingTemplates.days.filter(function(d) { return d.code === code; })[0];
  if (!list || !day) return;
  var validExercises = day.exercises.filter(function(ex) { return typeof ex.calories === 'number'; });
  if (!validExercises.length) {
    updateSummary(t);
    return;
  }
  list.innerHTML = validExercises.map(function(exercise) {
    return exoButtonHtml(exercise.name, exercise.note, exercise.dose, exercise.calories, exercise.muscleGroups, false, t, true);
  }).join('');
  list.querySelectorAll('.exo').forEach(function(exercise) {
    exercise.addEventListener('click', function() {
      exercise.classList.toggle('selected');
      updateSummary(t);
    });
  });
  updateSummary(t);
}

function bindTemplateImport(trainingTemplates, t) {
  document.querySelectorAll('.tmpl-pick').forEach(function(btn) {
    btn.addEventListener('click', function() {
      importTemplateDay(btn.dataset.day, trainingTemplates, t);
    });
  });
}

function renderTemplates(trainingTemplates, t) {
  var days = trainingTemplates.days.map(function(day) {
    var exercises = day.exercises.map(function(exercise) {
      var note = exercise.note ? '<div class="note">' + escapeHtml(exercise.note) + '</div>' : '';
      return '<div class="ex"><div><div class="name">' + escapeHtml(exercise.name) + '</div>' + note +
        '</div><div class="dose">' + escapeHtml(exercise.dose) + '</div></div>';
    }).join('');
    return '<details class="day tmpl-day"><summary class="day-h"><span class="code">' + escapeHtml(day.code) +
      '</span><span class="focus">' + escapeHtml(day.focus) + '</span><span class="day-arrow">▸</span></summary>' +
      '<div class="day-body">' + exercises + '</div></details>';
  }).join('');

  document.getElementById('p-templates').innerHTML =
  '<div class="eyebrow">' + escapeHtml(t.templateEyebrow) + '</div>' +
  '<div class="note-card"><p>' + escapeHtml(trainingTemplates.intro) + '</p></div>' + 
  '<div class="note-card amber"><h3>' + escapeHtml(trainingTemplates.orderingNote.title) + '</h3><p>' +
  escapeHtml(trainingTemplates.orderingNote.description) + '</p></div>' +
  days;
}

function buildTestHistoryHtml(testHistory, t) {
  if (!testHistory || !testHistory.records || !testHistory.records.length) return { gtxt: '', panel: '' };
  var metrics = testHistory.metrics || [];
  var records = testHistory.records;
  var latest = records[records.length - 1];
  var primaryMetric = metrics.filter(function(m) { return m.primary; })[0] || metrics[0];

  var testItems = metrics.map(function(m) {
    var unit = m.unit || 'cm';
    return '<div class="ti"><div class="tv">' + escapeHtml(String(latest[m.key])) + '<small> ' + escapeHtml(unit) +
      '</small></div><div class="tl">' + escapeHtml(m.name) + '</div></div>';
  }).join('');

  var deltaHtml = '';
  if (records.length >= 2 && primaryMetric) {
    var prev = records[records.length - 2];
    var diff = Number(latest[primaryMetric.key]) - Number(prev[primaryMetric.key]);
    var unit = primaryMetric.unit || 'cm';
    var diffText = (diff >= 0 ? '▲ +' : '▼ ') + diff + unit;
    deltaHtml = '<span class="delta' + (diff < 0 ? ' down' : '') + '">' + escapeHtml(t.jumpDeltaVs(diffText, prev.month)) + '</span>';
  }

  var testsBlock = '<div class="tests"><div class="tests-label"><span>' + escapeHtml(t.jumpLatestLabel(latest.month)) +
    '</span>' + deltaHtml + '</div><div class="tests-row">' + testItems + '</div></div>';

  var sparkBlock;
  if (records.length >= 2) {
    var w = 560, h = 70, padX = 10, padY = 6;
    var innerW = w - padX * 2, innerH = h - padY * 2;
    var legend = metrics.map(function(m) {
      return '<span><i style="background:' + m.color + '"></i>' + escapeHtml(m.name) + '</span>';
    }).join('');
    var lines = metrics.map(function(m) {
      var values = records.map(function(r) { return Number(r[m.key]); });
      var minV = Math.min.apply(null, values), maxV = Math.max.apply(null, values);
      if (minV === maxV) { minV -= 1; maxV += 1; }
      var points = values.map(function(v, i) {
        var x = padX + (records.length === 1 ? 0 : i * (innerW / (records.length - 1)));
        var y = padY + innerH - ((v - minV) / (maxV - minV)) * innerH;
        return x.toFixed(1) + ',' + y.toFixed(1);
      });
      var lastPoint = points[points.length - 1].split(',');
      return '<polyline points="' + points.join(' ') + '" fill="none" stroke="' + m.color +
        '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + lastPoint[0] +
        '" cy="' + lastPoint[1] + '" r="3" fill="' + m.color + '"/>';
    }).join('');
    sparkBlock = '<div class="spark-wrap"><div class="spark-row"><div class="spark-label">' +
      escapeHtml(t.jumpTrendLabel(records[0].month, records[records.length - 1].month)) +
      '</div><div class="spark-legend">' + legend + '</div></div><svg class="spark" viewBox="0 0 ' + w + ' ' + h +
      '" xmlns="http://www.w3.org/2000/svg">' + lines + '</svg></div>';
  } else {
    sparkBlock = '<div class="spark-wrap"><div class="spark-empty">' + escapeHtml(t.jumpTrendEmpty) + '</div></div>';
  }

  var toggleBlock = '<button class="hist-toggle" type="button" id="jump-hist-toggle"><span class="arrow">▸</span> ' +
    escapeHtml(t.jumpHistoryToggle) + '</button>';

  var headerRow = '<div class="hrow"><div>' + escapeHtml(t.jumpHistoryMonthCol) + '</div>' +
    metrics.map(function(m) { return '<div>' + escapeHtml(m.name) + '</div>'; }).join('') + '</div>';
  var dataRows = records.map(function(r) {
    return '<div class="hrow"><div>' + escapeHtml(r.month) + '</div>' +
      metrics.map(function(m) { return '<div><b>' + escapeHtml(String(r[m.key])) + '</b></div>'; }).join('') + '</div>';
  }).join('');
  var panelHtml = '<div class="hist-panel" id="jump-hist-panel"><div class="hist-panel-inner">' + headerRow + dataRows + '</div></div>';

  return { gtxt: testsBlock + sparkBlock + toggleBlock, panel: panelHtml };
}

function renderJump(jumpTraining, t) {
  var target = jumpTraining.target;
  var menus = jumpTraining.menus.map(function(menu) {
    var exercises = menu.exercises.map(function(exercise) {
      var note = exercise.note ? '<div class="note">' + escapeHtml(exercise.note) + '</div>' : '';
      return '<div class="ex"><div><div class="name">' + escapeHtml(exercise.name) + '</div>' + note +
        '</div><div class="dose">' + escapeHtml(exercise.dose) + '</div></div>';
    }).join('');
    return '<div class="day"><div class="day-h"><span class="code">' + escapeHtml(menu.name) +
      '</span><span class="focus">' + escapeHtml(menu.condition) + '</span></div>' + exercises + '</div>';
  }).join('');
  var moves = jumpTraining.specialMoves.map(function(move) {
    return '<div class="card"><div class="card-h"><span class="name">' + escapeHtml(move.name) +
      '</span><span class="tag' + (move.tone === 'blue' ? ' blue' : '') + '">' + escapeHtml(move.tag) +
      '</span></div><p>' + escapeHtml(move.description) + '</p></div>';
  }).join('');
  var difference = target.netHeightCm - target.standingReachCm;
  var history = buildTestHistoryHtml(jumpTraining.testHistory, t);

  document.getElementById('p-jump').innerHTML =
    '<div class="hero"><div class="gauge-hero"><div class="gauge" id="gauge"><div class="track"><div class="fill" id="fill"></div></div>' +
    '<div class="zone" style="bottom:82%;height:11%"></div><div class="tick" style="bottom:60%"><i></i><b>' + escapeHtml(t.jumpReachLabel) + ' ' +
    Number(target.standingReachCm) + '</b></div><div class="tick" style="bottom:82%"><i></i><b>' + escapeHtml(t.jumpNetLabel) + ' ' +
    Number(target.netHeightCm) + '</b></div><div class="tick" style="bottom:93%"><i></i><b>' + escapeHtml(t.jumpGoalLabel) + ' ' +
    Number(target.targetMaxCm) + '</b></div></div><div class="gtxt"><div class="gk">' + escapeHtml(t.jumpTargetLabel) + '</div><div class="gv">' +
    t.jumpTargetSentence(Number(target.standingReachCm), Number(target.netHeightCm), difference, Number(target.verticalJumpMinCm), Number(target.verticalJumpMaxCm)) +
    '</div>' + history.gtxt + '</div></div>' + history.panel + '</div><div class="eyebrow">' + escapeHtml(t.jumpMenuEyebrow) + '</div>' + menus +
    '<div class="eyebrow">' + escapeHtml(t.jumpSkillEyebrow) + '</div><div class="note-card amber"><h3>' +
    escapeHtml(jumpTraining.approachSkill.title) + '</h3><p>' + escapeHtml(jumpTraining.approachSkill.description) +
    '</p></div><div class="eyebrow">' + escapeHtml(t.jumpMovesEyebrow) + '</div>' + moves +
    '<div class="note-card amber"><h3>' + escapeHtml(jumpTraining.phaseNote.title) + '</h3><p>' +
    escapeHtml(jumpTraining.phaseNote.description) + '</p></div>';

  var histToggle = document.getElementById('jump-hist-toggle');
  if (histToggle) {
    histToggle.addEventListener('click', function() {
      var panel = document.getElementById('jump-hist-panel');
      var isOpen = panel.classList.toggle('open');
      histToggle.classList.toggle('open', isOpen);
    });
  }
}

function renderDiet(diet, t) {
  var targets = diet.dailyTargets.map(function(target) {
    var valueClass = 'v' + (target.tone === 'amber' ? ' a' : target.tone === 'blue' ? ' b t' : '');
    return '<div><div class="l">' + escapeHtml(target.label) + '</div><div class="' + valueClass + '">' +
      escapeHtml(target.value) + '</div></div>';
  }).join('');
  var meals = diet.meals.map(function(meal) {
    return '<b>' + escapeHtml(meal.name) + '</b>　' + escapeHtml(meal.description);
  }).join('<br>');
  var proteinSources = diet.proteinSources.map(function(source) {
    return '<span class="chip">' + escapeHtml(source) + '</span>';
  }).join('');
  var refuels = diet.refuelPlans.map(function(plan) {
    return '<div class="card"><div class="card-h"><span class="name">' + escapeHtml(plan.name) +
      '</span><span class="tag">' + escapeHtml(plan.burn) + '</span></div><p>' + escapeHtml(plan.targets) +
      '<br><span style="color:var(--muted)">' + escapeHtml(t.dietExamplePrefix) + escapeHtml(plan.example) + '</span></p></div>';
  }).join('');

  document.getElementById('p-diet').innerHTML =
    '<div class="eyebrow">' + escapeHtml(t.dietDailyEyebrow) + '</div><div class="macro">' + targets +
    '</div><div class="note-card"><h3>' + escapeHtml(t.dietMealsTitle) + '</h3><p>' + meals +
    '</p></div><div class="eyebrow">' + escapeHtml(t.dietProteinEyebrow) + '</div><div class="chips">' + proteinSources +
    '</div><div class="eyebrow">' + escapeHtml(t.dietRefuelEyebrow) + '</div>' + refuels +
    '<div class="note-card good"><h3>' + escapeHtml(diet.strategy.title) + '</h3><p>' +
    escapeHtml(diet.strategy.description) + '</p></div>';
}

function renderRecovery(recovery, t) {
  var sections = recovery.sections.map(function(section) {
    var tone = section.tone === 'default' ? '' : ' ' + section.tone;
    return '<div class="eyebrow">' + escapeHtml(section.eyebrow) + '</div><div class="note-card' + tone +
      '"><h3>' + escapeHtml(section.title) + '</h3><p>' + escapeHtml(section.description) + '</p></div>';
  }).join('');
  document.getElementById('p-notes').innerHTML = sections + '<div class="disc">' + escapeHtml(t.disclaimer) + '</div>';
}

function updateSummary(t) {
  var selected = document.querySelectorAll('.exo.selected');
  var kcal = 0;
  var tagsSet = new Set();
  selected.forEach(function(el) {
    kcal += parseInt(el.dataset.kcal, 10);
    el.dataset.tags.split(',').forEach(function(tag) { tagsSet.add(tag); });
  });
  document.getElementById('sum-kcal').innerHTML = kcal + '<small> ' + escapeHtml(t.kcal) + '</small>';
  document.getElementById('sum-count').textContent = selected.length ? t.selectedCount(selected.length) : t.notSelected;
  var tagsEl = document.getElementById('sum-tags');
  tagsEl.innerHTML = tagsSet.size
    ? Array.from(tagsSet).map(function(tag) { return '<span class="bchip">' + escapeHtml(tag) + '</span>'; }).join('')
    : '<span class="empty">' + escapeHtml(t.emptyTags) + '</span>';
  document.getElementById('sum-list').innerHTML = Array.from(selected).map(function(el) {
    var name = el.querySelector('.exo-name').textContent;
    var sub = el.querySelector('.exo-tags').textContent;
    return '<div class="bitem"><div><div class="bname">' + escapeHtml(name) + '</div><div class="bsub">' +
      escapeHtml(sub) + '</div></div><div class="bkc">' + Number(el.dataset.kcal) + ' ' + escapeHtml(t.kcal) + '</div></div>';
  }).join('');
}

var tabsBound = false;
function bindTabs() {
  if (tabsBound) return;
  tabsBound = true;
  document.querySelectorAll('.tabbtn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tabbtn').forEach(function(item) { item.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(panel) { panel.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      window.scrollTo(0, 0);
      if (btn.dataset.tab === 'p-jump') runGauge(true);
    });
  });
}

var currentGaugePercent = 0;
function runGauge(reset) {
  var fillEl = document.getElementById('fill');
  if (!fillEl) return;
  if (reset) {
    fillEl.style.height = '0%';
    setTimeout(function() { fillEl.style.height = currentGaugePercent + '%'; }, 60);
  } else {
    setTimeout(function() { fillEl.style.height = currentGaugePercent + '%'; }, 250);
  }
}

function bindBuilder(t) {
  document.querySelectorAll('.exo').forEach(function(exercise) {
    exercise.addEventListener('click', function() {
      exercise.classList.toggle('selected');
      updateSummary(t);
    });
  });
  var resetBtn = document.getElementById('reset-today');
  if (resetBtn) {
    resetBtn.addEventListener('click', function() {
      document.querySelectorAll('.exo.selected').forEach(function(exercise) { exercise.classList.remove('selected'); });
      clearTemplateImport();
      updateSummary(t);
    });
  }
  updateSummary(t);
}

function applyStaticStrings(t) {
  document.documentElement.lang = t.htmlLang;
  document.title = t.brandTitle;
  document.getElementById('brand-title').textContent = t.brandTitle;
  document.getElementById('lang-toggle').textContent = t.toggleLabel;
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var parts = el.getAttribute('data-i18n').split('.');
    var text = t.tabs[parts[1]];
    if (text) el.textContent = text;
  });
}

function renderAll(lang) {
  var plan = planData[lang];
  var t = UI_STRINGS[lang];
  currentLang = lang;
  localStorage.setItem('trainingLang', lang);
  applyStaticStrings(t);
  renderOverview(plan.profile, t);
  renderTraining(plan.training, plan.trainingTemplates, t);
  renderTemplates(plan.trainingTemplates, t);
  renderJump(plan.jumpTraining, t);
  renderDiet(plan.diet, t);
  renderRecovery(plan.recovery, t);
  currentGaugePercent = Number(plan.jumpTraining.target.gaugePercent);
  bindTabs();
  bindBuilder(t);
  runGauge(document.getElementById('p-jump').classList.contains('active'));
}

Promise.all([
  fetch('./plan.json', { cache: 'no-store' }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' (plan.json)');
    return r.json();
  }),
  fetch('./plan.en.json', { cache: 'no-store' }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' (plan.en.json)');
    return r.json();
  })
])
  .then(function(results) {
    planData.zh = results[0];
    planData.en = results[1];
    renderAll(currentLang);
    document.getElementById('lang-toggle').addEventListener('click', function() {
      renderAll(currentLang === 'zh' ? 'en' : 'zh');
    });
  })
  .catch(function(error) {
    var t = UI_STRINGS[currentLang];
    document.querySelector('.wrap').innerHTML =
      '<div class="note-card warn"><h3>' + escapeHtml(t.loadError) + '</h3><p>' + escapeHtml(error.message) +
      escapeHtml(t.loadErrorHint) + '</p></div>';
    console.error(error);
  });
</script>
